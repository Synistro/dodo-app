<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#050a1a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Johanna">
<title>Les Histoires du Soir ✨</title>
<link rel="manifest" href="manifest.json">
<link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:ital,wght@0,300;0,400;1,300;1,400&family=Quicksand:wght@300;400;500&family=Baloo+2:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<div class="stars-bg" id="starsBg"></div>

<audio id="bgMusic" src="audio/berceuse.mp3" loop preload="auto"></audio>

<!-- LANDING -->
<div class="view active" id="landing">
  <button class="btn-fullscreen" id="btnFullscreen" onclick="toggleFullscreen()" title="Plein écran">⛶</button>
  <div class="landing-moon"></div>
  <h1 class="landing-title">Les Histoires<br>du Soir</h1>
  <p class="landing-sub">pour les petits rêveurs</p>
  <div class="landing-cards">
    <div class="landing-card card-stories" onclick="showView('library')">
      <span class="card-icon">📖</span>
      <span class="card-label">Histoires</span>
    </div>
    <div class="landing-card card-game" onclick="showView('games')">
      <span class="card-icon">🎈</span>
      <span class="card-label">Jeux</span>
    </div>
  </div>
</div>

<!-- LIBRARY -->
<div class="view" id="library">
  <div class="lib-header">
    <button class="btn-back" onclick="showView('landing')">←</button>
    <span class="lib-title">Choisir une histoire</span>
  </div>
  <div class="lib-grid" id="libGrid"></div>
</div>

<!-- READER §7.1 -->
<div class="view" id="reader">
  <button class="reader-back" onclick="readerBack()">←</button>
  <div class="reader-controls" id="readerControls">
    <button class="reader-ctrl-btn" id="btnMusic" onclick="toggleMusic()" title="Berceuse">🎵</button>
    <button class="reader-ctrl-btn" id="btnTTS" onclick="toggleTTS()" title="Lecture">▶</button>
    <button class="reader-ctrl-btn" id="btnLock" onclick="toggleLock()" title="Verrouiller">🔒</button>
  </div>
  <div id="readerScroll">
    <div id="readerTrack"></div>
  </div>
  <!-- §7.4 Boîte texte flottante — hors panels -->
  <div id="readerTextBox">
    <div id="rdrTitle"></div>
    <div id="rdrText"></div>
  </div>
  <!-- §7.12 Dots pagination -->
  <div id="readerDots"></div>
  <!-- §7.8 Écran de fin -->
  <div id="readerEnd">
    <div class="reader-end-moon">🌙</div>
    <div class="reader-end-msg">Fin. Bonne nuit.</div>
    <button class="reader-end-btn" onclick="readerBack()">Retour aux histoires</button>
  </div>
</div>

<!-- GAMES HUB -->
<div class="view" id="games">
  <div class="lib-header">
    <button class="btn-back" onclick="showView('landing')">←</button>
    <span class="lib-title">Choisir un jeu</span>
  </div>
  <div class="games-grid">
    <button class="game-tile" onclick="showView('game'); startGame()"><span class="tile-icon">🎈</span><span class="tile-label">Ballons</span></button>
    <button class="game-tile" onclick="showView('fireflies'); startFireflies()"><span class="tile-icon">✨</span><span class="tile-label">Lucioles</span></button>
    <button class="game-tile" onclick="showView('animals'); startAnimals()"><span class="tile-icon">🦉</span><span class="tile-label">Les animaux de la nuit</span></button>
    <button class="game-tile" onclick="showView('memory'); startMemory()"><span class="tile-icon">🌙</span><span class="tile-label">Memory</span></button>
    <button class="game-tile" onclick="showView('morpion'); startMorpion()"><span class="tile-icon">⭕</span><span class="tile-label">Morpion</span></button>
    <button class="game-tile" onclick="showView('runner'); startRunner()"><span class="tile-icon">🐰</span><span class="tile-label">La course de Pompon</span></button>
  </div>
</div>

<!-- GAME : BALLONS -->
<div class="view" id="game">
  <div class="game-header">
    <button class="btn-back" onclick="showView('games'); stopGame()">←</button>
    <div class="game-score">Pop : <span id="scoreVal">0</span><span class="game-record">Record <span id="highVal">0</span></span></div>
  </div>
  <canvas id="game-canvas"></canvas>
</div>

<!-- GAME : LUCIOLES -->
<div class="view" id="fireflies">
  <div class="game-header">
    <button class="btn-back" onclick="showView('games'); stopFireflies()">←</button>
    <div class="game-score">Lucioles ✨</div>
  </div>
  <canvas id="fireflies-canvas"></canvas>
</div>

<!-- GAME : ANIMAUX DE LA NUIT -->
<div class="view" id="animals">
  <div class="lib-header">
    <button class="btn-back" onclick="showView('games')">←</button>
    <span class="lib-title">Les animaux de la nuit</span>
  </div>
  <div class="animals-grid" id="animalsGrid"></div>
</div>

<!-- GAME : MEMORY -->
<div class="view" id="memory">
  <div class="lib-header">
    <button class="btn-back" onclick="showView('games'); stopMemory()">←</button>
    <span class="lib-title">Memory</span>
  </div>
  <div class="memory-grid" id="memoryGrid"></div>
  <div class="memory-win" id="memoryWin">
    <div class="memory-win-msg">⭐ Bravo ! ⭐</div>
    <button class="reader-end-btn" onclick="startMemory()">Rejouer</button>
    <button class="reader-end-btn" onclick="showView('games'); stopMemory()">Retour aux jeux</button>
  </div>
</div>

<!-- GAME : MORPION -->
<div class="view" id="morpion">
  <div class="lib-header">
    <button class="btn-back" onclick="showView('games'); stopMorpion()">←</button>
    <span class="lib-title">Morpion</span>
  </div>
  <div class="morpion-modes">
    <button class="mrp-mode active" data-mode="solo" onclick="setMorpionMode('solo')">🌙 Contre la lune</button>
    <button class="mrp-mode" data-mode="duo" onclick="setMorpionMode('duo')">⭐🌙 À deux</button>
  </div>
  <div class="morpion-turn" id="morpionTurn"></div>
  <div class="morpion-grid" id="morpionGrid"></div>
  <div class="memory-win" id="morpionWin">
    <div class="memory-win-msg" id="morpionMsg"></div>
    <button class="reader-end-btn" onclick="startMorpion()">Rejouer</button>
    <button class="reader-end-btn" onclick="showView('games'); stopMorpion()">Retour aux jeux</button>
  </div>
</div>

<!-- GAME : LA COURSE DE POMPON -->
<div class="view" id="runner">
  <div class="game-header">
    <button class="btn-back" onclick="showView('games'); stopRunner()">←</button>
    <div class="game-score">⭐ <span id="runScoreVal">0</span><span class="game-record">Record <span id="runBestVal">0</span></span></div>
  </div>
  <canvas id="runner-canvas"></canvas>
  <div class="memory-win" id="runnerEnd">
    <div class="memory-win-msg">Oh ! Pompon a trébuché 🙈</div>
    <div class="runner-end-score" id="runnerEndScore"></div>
    <button class="reader-end-btn" onclick="startRunner()">Rejouer</button>
    <button class="reader-end-btn" onclick="showView('games'); stopRunner()">Retour aux jeux</button>
  </div>
</div>

<script src="js/stories.js"></script>
<script src="js/reader.js"></script>
<script src="js/game.js"></script>
<script src="js/fireflies.js"></script>
<script src="js/animals.js"></script>
<script src="js/memory.js"></script>
<script src="js/morpion.js"></script>
<script src="js/runner.js"></script>
<script src="js/app.js"></script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch(err => console.warn('SW:', err));
    });
  }
</script>
</body>
</html>
